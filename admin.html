<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Admin · AguaVida</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    .admin-wrap { max-width:1200px; margin:2rem auto; padding:0 1.5rem; }
    .admin-wrap h1 { color:#083c5c; margin-bottom:1.5rem; }
    .filtros {
      display:flex; gap:.6rem; margin-bottom:1rem; flex-wrap:wrap;
      align-items:center;
    }
    .filtros button {
      padding:.55rem 1.1rem; border-radius:40px; border:1.5px solid #cde3f0;
      background:#fff; cursor:pointer; font-weight:600; color:#0b5e8a;
      font-size:.85rem; transition:.15s;
    }
    .filtros button:hover { border-color:#2a9df4; }
    .filtros button.active { background:#2a9df4; color:#fff; border-color:#2a9df4; }

    /* Barra de rango de fechas */
    .rango-fechas {
      display:flex; gap:.6rem; align-items:center;
      padding:.8rem 1rem; background:#f6fcff;
      border:1.5px solid #d9edfa; border-radius:20px;
      margin-bottom:1rem; flex-wrap:wrap;
    }
    .rango-fechas label {
      font-size:.85rem; color:#417e9e; font-weight:600;
    }
    .rango-fechas input[type="date"] {
      padding:.5rem .8rem; border-radius:12px;
      border:1.5px solid #cde3f0; background:#fff;
      font-size:.85rem; color:#0b3550; outline:none;
      font-family:inherit;
    }
    .rango-fechas input[type="date"]:focus { border-color:#2a9df4; }
    .btn-aplicar {
      padding:.55rem 1.1rem; border-radius:40px; border:none;
      background:linear-gradient(135deg,#1f8ac0,#2a9df4);
      color:#fff; font-weight:700; font-size:.85rem; cursor:pointer;
      transition:.15s;
    }
    .btn-aplicar:hover { transform:translateY(-1px); }
    .btn-limpiar {
      padding:.55rem 1.1rem; border-radius:40px;
      border:1.5px solid #cde3f0; background:#fff;
      color:#417e9e; font-weight:600; font-size:.85rem; cursor:pointer;
    }

    .contador-resultados {
      font-size:.85rem; color:#417e9e; margin-bottom:1rem;
      padding:.5rem 1rem; background:#eef8ff; border-radius:20px;
      display:inline-block;
    }

    table { width:100%; border-collapse:collapse; background:#fff; border-radius:20px; overflow:hidden; box-shadow:0 10px 30px -15px rgba(0,80,130,.2); }
    th, td { padding:1rem; text-align:left; border-bottom:1px solid #e6f4ff; font-size:.9rem; }
    th { background:#e6f4ff; color:#0b3550; font-weight:700; }
    .estado { padding:.3rem .9rem; border-radius:40px; font-size:.8rem; font-weight:700; }
    .estado.pendiente { background:#fff3cd; color:#856404; }
    .estado.entregado { background:#def2e6; color:#186b4b; }
    .estado.cancelado { background:#fde2e2; color:#a02020; }
    .acciones button {
      padding:.4rem .8rem; border-radius:20px; border:none; cursor:pointer;
      font-size:.8rem; font-weight:600; margin-right:4px;
    }
    .btn-ok { background:#def2e6; color:#186b4b; }
    .btn-x { background:#fde2e2; color:#a02020; }
    .login-admin { max-width:400px; margin:5rem auto; padding:2.5rem; background:#fff; border-radius:30px; box-shadow:0 20px 40px -20px rgba(0,80,130,.3); }
    .login-admin input { width:100%; padding:.9rem 1.2rem; border-radius:60px; border:1.5px solid #cde3f0; margin-bottom:1rem; }
    .hidden { display:none !important; }
  </style>
</head>
<body>
  <header class="header">
    <div class="logo"><i class="fas fa-droplet"></i><span>Agua<strong>Vida</strong> Admin</span></div>
    <a href="index.html" style="color:#2a9df4;">← Volver al sitio</a>
  </header>

  <div id="loginAdmin" class="login-admin">
    <h2 style="color:#083c5c;margin-bottom:1.5rem;">Acceso administrador</h2>
    <input type="email" id="adminEmail" placeholder="Correo">
    <input type="password" id="adminPass" placeholder="Contraseña">
    <button class="btn-primary" id="btnAdminLogin" style="width:100%;">Entrar</button>
    <p id="adminMsg" style="margin-top:1rem;text-align:center;color:#a02020;"></p>
  </div>

  <div id="panelAdmin" class="admin-wrap hidden">
    <h1><i class="fas fa-clipboard-list"></i> Pedidos</h1>

    <!-- Filtros por estado -->
    <div class="filtros">
      <button data-filtro="todos" class="active">Todos</button>
      <button data-filtro="pendiente">Pendientes</button>
      <button data-filtro="entregado">Entregados</button>
      <button data-filtro="cancelado">Cancelados</button>
    </div>

    <!-- Filtros rápidos por fecha -->
    <div class="filtros">
      <span style="font-size:.85rem;color:#417e9e;font-weight:600;margin-right:.4rem;">
        <i class="fas fa-calendar-day"></i> Fecha:
      </span>
      <button data-fecha="hoy">Hoy</button>
      <button data-fecha="ayer">Ayer</button>
      <button data-fecha="7dias">Últimos 7 días</button>
      <button data-fecha="mes">Este mes</button>
      <button data-fecha="todo" class="active">Todo</button>
    </div>

    <!-- Rango personalizado -->
    <div class="rango-fechas">
      <label><i class="fas fa-calendar-alt"></i> Rango personalizado:</label>
      <input type="date" id="fechaDesde">
      <span style="color:#8aa9bd;">→</span>
      <input type="date" id="fechaHasta">
      <button class="btn-aplicar" id="btnAplicarRango">Aplicar</button>
      <button class="btn-limpiar" id="btnLimpiarFiltros">Limpiar</button>
    </div>

    <div class="contador-resultados" id="contadorResultados"></div>

    <div style="overflow-x:auto;">
      <table>
        <thead>
          <tr>
            <th>Fecha</th><th>Cliente</th><th>Teléfono</th><th>Dirección</th>
            <th>Productos</th><th>Total</th><th>Horario</th><th>Estado</th><th>Acciones</th>
          </tr>
        </thead>
        <tbody id="tablaPedidos"></tbody>
      </table>
    </div>
  </div>

  <script type="module" src="js/admin.js"></script>
</body>
</html>
